name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # - name: Get JRE17
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-new
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre17-pojav
      #
      # - name: Get JRE21
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-21
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre21-pojav
      #
      # - name: Get JRE25
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-25
      #     workflow_conclusion: completed
      #     repo: FCL-Team/Android-OpenJDK-Build
      #     branch: Build_JRE_25
      #     name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build RESENHALAUNCHER Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/RESENHALAUNCHER-debug.apk

      - name: Gen md5sum
        run: |
          md5sum out/RESENHALAUNCHER-debug.apk > out/RESENHALAUNCHER-debug.md5

      - name: Upload RESENHALAUNCHER Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RESENHALAUNCHER-debug
          path: out/RESENHALAUNCHER-debug.*


  build_pojav_modpack:
    name: Build PojavLauncher Modpack APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          path: wrapper

      - name: Checkout official PojavLauncher
        uses: actions/checkout@v4
        with:
          repository: TeamPojavLauncher/PojavLauncher
          ref: v3_openjdk
          submodules: recursive
          path: pojav

      - name: Patch PojavLauncher
        run: python3 wrapper/scripts/patch_pojav_modpack.py pojav

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: pojav/app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: pojav/app_pojavlauncher/libs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.14.5"

      - name: Build PojavLauncher Debug APK
        working-directory: pojav
        run: |
          mkdir -p ../pojav-out
          gradle :app_pojavlauncher:assembleFullDebug
          cp app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk ../pojav-out/PojavLauncher-Modpack-debug.apk

      - name: Upload PojavLauncher Modpack APK
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-Modpack
          path: pojav-out/PojavLauncher-Modpack-debug.apk
